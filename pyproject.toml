[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "PL", "RUF", "D"]
ignore = ["D203", "D213", "PLR2004", "PLR0913", "D100", "D104", "E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
